name: Build & Deploy to VPS

on:
  push:
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  test:
    name: Run CI Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Frontend Checks (Lint & Typecheck)
        run: |
          npm ci
          npm run lint
          npm run typecheck

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Backend Tests (Pytest)
        run: |
          python -m pip install --upgrade pip
          pip install -r api/requirements.txt -r api/requirements-dev.txt
          cd api && python -m pytest tests/ -q

  deploy:
    name: Deploy to Silicon Valley VPS
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - name: SSH Deploy to VPS
        uses: appleboy/ssh-action@v1.2.0
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        if: env.VPS_HOST != ''
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME != '' && secrets.VPS_USERNAME || 'ubuntu' }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script_stop: true
          script: |
            set -e
            DEPLOY_PATH="/opt/govps"
            echo "==> Deploying to ${DEPLOY_PATH}..."
            cd "${DEPLOY_PATH}"

            echo "==> Pulling latest code from main branch..."
            git fetch origin main
            git reset --hard origin/main

            echo "==> Local SQLite snapshot before rebuild/migrate..."
            python3 "${DEPLOY_PATH}/scripts/snapshot-sqlite.py"

            echo "==> Building and starting containers..."
            docker compose up -d --build --remove-orphans

            echo "==> Running database migrations..."
            docker compose exec -T api alembic upgrade head

            echo "==> Cleaning dangling docker images..."
            docker image prune -f

            echo "==> Current container status:"
            docker compose ps

            echo "==> Deployment finished successfully! 🚀"
