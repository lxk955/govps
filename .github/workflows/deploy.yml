name: Build & Deploy to VPS

on:
  push:
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  test:
    name: Run CI Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Frontend Checks (Lint & Typecheck)
        run: |
          npm ci
          npm run lint
          npm run typecheck

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Backend Tests (Pytest)
        run: |
          python -m pip install --upgrade pip
          pip install -r api/requirements.txt -r api/requirements-dev.txt
          cd api && python -m pytest tests/ -q

  deploy:
    name: Deploy to Silicon Valley VPS
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - name: SSH Deploy to VPS
        uses: appleboy/ssh-action@v1.2.0
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        if: env.VPS_HOST != ''
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME || 'root' }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          script: |
            set -e
            DEPLOY_PATH="${{ secrets.VPS_DEPLOY_PATH || '/opt/govps' }}"
            echo "==> Deploying to ${DEPLOY_PATH}..."
            mkdir -p "${DEPLOY_PATH}"
            cd "${DEPLOY_PATH}"

            if [ ! -d ".git" ]; then
              echo "==> First time deployment: cloning repository..."
              git clone https://github.com/lxk955/govps.git .
            else
              echo "==> Pulling latest code from main branch..."
              git fetch origin main
              git reset --hard origin/main
            fi

            if [ ! -f ".env" ]; then
              echo "==> Creating default .env from .env.example..."
              cp .env.example .env
              echo "TASK_TOKEN=$(openssl rand -hex 16)" >> .env
            fi

            echo "==> Building and starting containers..."
            docker compose up -d --build --remove-orphans

            echo "==> Running database migrations..."
            docker compose exec -T api alembic upgrade head

            echo "==> Cleaning dangling docker images..."
            docker image prune -f

            echo "==> Current container status:"
            docker compose ps

            echo "==> Deployment finished successfully! 🚀"
