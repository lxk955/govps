name: CI

on:
  pull_request:

jobs:
  web:
    name: Frontend (lint / typecheck / build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build

  api:
    name: Backend & crawler fixtures (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      # fixtures 回放测试全程禁网（AGENTS.md Crawler Testing）；
      # conftest 已设置 SKIP_STARTUP_SCAN=1，导入 app.main 不触发抓取
      - name: Run tests
        run: python -m pytest tests/ -q
