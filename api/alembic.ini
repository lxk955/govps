# Alembic 配置（P7：版本化迁移正式接管 schema 演进，refactor-plan §2 #8 / §4）
#
# 连接串不落盘于此：env.py 运行时从 app.config.settings.DATABASE_URL 注入
# （经 database._normalize_db_url 规范化到 postgresql+psycopg://），
# 与应用运行时使用同一来源，避免 ini/env 两处漂移。
[alembic]
script_location = migrations
prepend_sys_path = .
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
