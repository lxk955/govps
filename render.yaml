# GoVPS 自动化 Blueprint 基础设施定义文件（render.yaml）
# 在 Render 控制台直接点击「New + -> Blueprint」连接仓库，即可自动创建服务并自动注入全部环境变量。

services:
  # 1. FastAPI 后端服务
  - type: web
    name: govps-api
    runtime: python
    rootDir: api
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-8000}
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false # Render 部署时会自动弹窗让你选择现有的 Postgres 数据库或直接复用
      - key: TASK_TOKEN
        generateValue: true # Render 自动生成 64 位高强度随机秘钥，无需手动输入
      - key: SKIP_STARTUP_SCAN
        value: "true"
      - key: NOTIFY_WORKER_ENABLED
        value: "true"
      - key: MAIL_FROM
        value: GoVPS <notify@govps.xyz>
      - key: PUBLIC_API_URL
        value: https://vps.govps.xyz
      - key: CORS_ORIGINS
        value: https://vps.govps.xyz,https://govps.xyz,http://localhost:3000
      - key: RESEND_API_KEY
        sync: false

  # 2. Next.js App Router 前端服务
  - type: web
    name: govps-web
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /keepalive
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      # SEO 基准域名（canonical / og:url / sitemap / robots.txt 的唯一来源，见 src/lib/site.ts）。
      # 现阶段走测试域名；正式切到 govps.xyz 时改此处并重新部署——NEXT_PUBLIC_* 是构建期内联的，
      # 只改环境变量不重新构建不会生效。
      - key: NEXT_PUBLIC_SITE_URL
        value: https://vps.govps.xyz
      - key: API_ORIGIN
        fromService:
          type: web
          name: govps-api
          property: host
