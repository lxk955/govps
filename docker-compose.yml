services:
  # 1. FastAPI 后端服务（处理数据库、定时抓取、异步发信、业务评分）
  api:
    image: ${API_IMAGE:-ghcr.io/lxk955/govps-api:latest}
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: govps-api
    restart: unless-stopped
    volumes:
      - ./data:/app/data
    environment:
      - DATABASE_URL=sqlite:////app/data/govps.db
      - SKIP_STARTUP_SCAN=true
      - NOTIFY_WORKER_ENABLED=true
      - CRAWL_INTERVAL_MINUTES=5
      - TASK_TOKEN=${TASK_TOKEN:-change-me}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - MAIL_FROM=${MAIL_FROM:-GoVPS · VPS雷达 <notify@govps.xyz>}
      - PUBLIC_API_URL=${SITE_URL:-https://govps.xyz}
      - CORS_ORIGINS=${SITE_URL:-https://govps.xyz},http://localhost:3000
      - R2_ACCOUNT_ID=${R2_ACCOUNT_ID:-}
      - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID:-}
      - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY:-}
      - R2_BUCKET=${R2_BUCKET:-govps-backups}
      - R2_ENDPOINT=${R2_ENDPOINT:-}
      - ADMIN_EMAILS=${ADMIN_EMAILS:-}
      - CRAWLER_PROXY=${CRAWLER_PROXY:-}
      - WARP_PROXY=${WARP_PROXY:-socks5://warp:1080}
      - WARP_ENABLED_MERCHANTS=${WARP_ENABLED_MERCHANTS:-vmiss}
      - FLARESOLVERR_URL=${FLARESOLVERR_URL:-http://flaresolverr:8191/v1}
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - govps-net

  # 2. Next.js 前端服务（App Router 服务端渲染与同域 API 反向代理）
  web:
    image: ${WEB_IMAGE:-ghcr.io/lxk955/govps-web:latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: govps-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - API_ORIGIN=http://api:8000
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/robots.txt"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - govps-net

  # 3. Caddy 反向代理网关（负责 HTTPS、HTTP/2/3、静态资源缓存与端口暴露）
  caddy:
    image: caddy:2-alpine
    container_name: govps-caddy
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      - SITE_DOMAIN=${SITE_DOMAIN:-govps.xyz}
    networks:
      - govps-net

  # 4. 可编程权威 DNS 服务（用于 DNS 泄露检测）
  dns:
    image: ${API_IMAGE:-ghcr.io/lxk955/govps-api:latest}
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: govps-dns
    restart: unless-stopped
    user: "0"
    command: ["python", "-m", "app.services.dns_server"]
    volumes:
      - ./data:/app/data
    environment:
      - DATABASE_URL=sqlite:////app/data/govps.db
      - SITE_DOMAIN=${SITE_DOMAIN:-govps.xyz}
      - SERVER_IP=43.173.89.152
    healthcheck:
      disable: true
    ports:
      - "53:53/udp"
      - "53:53/tcp"
    networks:
      - govps-net

  # 5. Cloudflare WARP 免费出口代理（为受盾保护的商家爬虫提供 AS13335 原生清洁出口）
  warp:
    image: caomingjun/warp
    container_name: govps-warp
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    environment:
      - WARP_SLEEP=2
    networks:
      - govps-net

  # 6. FlareSolverr 人机验证求解服务（通过无头 Chromium 突破 Cloudflare Turnstile / 盾拦截）
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: govps-flaresolverr
    restart: unless-stopped
    init: true
    environment:
      - LOG_LEVEL=info
      - CAPTCHA_SOLVER=none
    deploy:
      resources:
        limits:
          memory: 600M
    networks:
      - govps-net

networks:
  govps-net:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
